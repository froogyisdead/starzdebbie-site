<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>StarzDebbie ♡</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    :root {
      --soft-pink: #f9d7e8;
      --accent-pink: #f5a8c8;
      --dark-pink: #e07aa5;
      --bg: #fff5fa;
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Nunito', system-ui, sans-serif;
      background: var(--bg);
      color: #444;
      line-height: 1.7;
      min-height: 100vh;
    }
    header {
      background: linear-gradient(135deg, var(--soft-pink) 0%, #f8c8e0 100%);
      color: white;
      text-align: center;
      padding: 7rem 1rem 5rem;
      position: relative;
      overflow: hidden;
    }
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 4.2rem;
      margin-bottom: 0.4rem;
      text-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }
    header p {
      font-size: 1.5rem;
      opacity: 0.95;
    }
    nav {
      background: rgba(255,255,255,0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 1.2rem;
      text-align: center;
      box-shadow: 0 3px 15px rgba(229,152,102,0.08);
    }
    nav a {
      color: var(--dark-pink);
      margin: 0 1.8rem;
      text-decoration: none;
      font-weight: 600;
      font-size: 1.1rem;
      transition: all 0.3s;
    }
    nav a:hover { color: var(--accent-pink); transform: translateY(-2px); }
    .hero-img {
      width: 100%;
      max-width: 700px;
      border-radius: 24px;
      margin: 3rem auto 1rem;
      display: block;
      box-shadow: 0 12px 32px rgba(0,0,0,0.12);
      border: 6px solid white;
    }
    .stars {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      overflow: hidden;
    }
    .star {
      position: absolute;
      color: rgba(255,255,255,0.7);
      font-size: 1.6rem;
      animation: float 12s infinite linear;
      text-shadow: 0 0 6px rgba(255,182,193,0.8);
    }
    @keyframes float {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.6; }
      50% { opacity: 1; }
      100% { transform: translateY(-120vh) rotate(360deg); opacity: 0; }
    }
    footer {
      background: var(--accent-pink);
      color: white;
      text-align: center;
      padding: 2.5rem 1rem;
      margin-top: 5rem;
    }
    footer a {
      color: white;
      font-size: 1.8rem;
      margin: 0 1rem;
      transition: 0.3s;
    }
    footer a:hover { transform: scale(1.2); }
    @media (max-width: 768px) {
      header h1 { font-size: 3rem; }
      nav a { margin: 0 1rem; font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="about.html">About Me</a>
    <a href="wattpad.html">My Wattpad</a>
  </nav>
  <header>
    <h1>StarzDebbie</h1>
    <p>soft stories & pink dreams ♡</p>
  </header>
  <main style="max-width:1100px; margin:0 auto; padding:2rem;">
    <img src="https://i.pinimg.com/1200x/b9/0f/65/b90f65930899e76cb79b48ed121a14bb.jpg" alt="Cherry blossoms aesthetic" class="hero-img">
    <p style="text-align:center; font-size:1.4rem; margin:2rem 0; color:#555;">
      Welcome to my little space ♡<br>
      I'm just starting my Wattpad journey — come read, vibe, and grow with me.
    </p>
  </main>
  <footer>
    <div>
      <a href="#" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="#" target="_blank"><i class="fab fa-tiktok"></i></a>
      <a href="https://www.wattpad.com/user/StarzDebbie" target="_blank"><i class="fab fa-wattpad"></i></a>
    </div>
    <p style="margin-top:1.5rem;">Made with soft pink vibes • StarzDebbie 2026</p>
  </footer>
  <script>
    function createStars() {
      const container = document.getElementById('stars');
      for (let i = 0; i < 18; i++) {
        const star = document.createElement('span');
        star.className = 'star';
        star.innerHTML = '✧';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 8 + 's';
        star.style.animationDuration = (Math.random() * 10 + 10) + 's';
        container.appendChild(star);
      }
    }
    createStars();
  </script>
</body>
</html>
